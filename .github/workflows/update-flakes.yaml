name: update-flakes
on:
  schedule:
    - cron:  '*/120 * 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  get-flake-inputs:
    runs-on: ubuntu-latest
    outputs:
      flake-inputs: ${{ steps.get-flake-inputs.outputs.flake-inputs }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          sparse-checkout: flake.lock
      - id: get-flake-inputs
        run: |
          flake_inputs="$(jq -c '.nodes.root.inputs | {flake: keys}' flake.lock)"

          echo "flake-inputs=${flake_inputs}" >> "$GITHUB_OUTPUT"
  update-flake:
    name: update-${{ matrix.flake }}
    runs-on: ubuntu-latest
    needs: get-flake-inputs
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.get-flake-inputs.outputs.flake-inputs) }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          nix-installer-branch: main
          extra-conf: accept-flake-config = true
      - run: git config --global user.email "bot@github.com"
      - run: git config --global user.name "bot"
      - name: Update ${{ matrix.flake }} flake input
        env:
          FLAKE: ${{ matrix.flake }}
        run: nix flake update "$FLAKE"
      - name: Commit and open PR if flake.lock changed
        env:
          FLAKE: ${{ matrix.flake }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if git diff --quiet -- flake.lock; then
            echo "flake.lock has no changes for '${FLAKE}', skipping."
            exit 0
          fi

          branch="update-${FLAKE}"

          git checkout -b "${branch}"

          git add flake.lock
          git commit -m "chore(deps): update ${FLAKE} flake lock"

          git push origin "${branch}" --force-with-lease

          title="chore(deps): update ${FLAKE} flake lock"
          body="Automated update of the \`${FLAKE}\` flake input generated by the \`update-flakes\` workflow."

          existing_pr="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${branch}" --state open --json number --jq '.[0].number // empty')"

          if [ -n "${existing_pr}" ]; then
            gh pr edit "${existing_pr}" --title "${title}" --body "${body}"
          else
            gh pr create --title "${title}" --body "${body}" --head "${branch}" --delete-on-merge
          fi
